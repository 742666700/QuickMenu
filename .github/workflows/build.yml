name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # NSIS builds the installer (QuickMenu-Setup-<version>-x64.exe) from the small zip's files.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      # Tests that need a signed-in desktop (windows, tray, hotkeys) are skipped on the build machine.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInteractiveTests -Package
      # Two zips: QuickMenu-Portable-<version>-x64.zip carries its own runtime;
      # QuickMenu-Portable-<version>-x64-small.zip needs the .NET 10 Desktop Runtime.
      # QuickMenu-Setup-<version>-x64.exe installs the small build, downloading the runtime first when it is missing;
      # QuickMenu-Setup-<version>-x64-offline.exe carries the runtime installer inside.
      - uses: actions/upload-artifact@v4
        with:
          name: QuickMenu-portable
          path: |
            artifacts/QuickMenu-Portable-*-x64.zip
            artifacts/QuickMenu-Portable-*-x64-small.zip
            artifacts/QuickMenu-Setup-*-x64.exe
            artifacts/QuickMenu-Setup-*-x64-offline.exe
          if-no-files-found: error
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QuickMenu-Portable-*-x64.zip
            artifacts/QuickMenu-Portable-*-x64-small.zip
            artifacts/QuickMenu-Setup-*-x64.exe
            artifacts/QuickMenu-Setup-*-x64-offline.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
