name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Tests that need a signed-in desktop (windows, tray, hotkeys) are skipped on the build machine.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInteractiveTests -Package
      - uses: actions/upload-artifact@v4
        with:
          name: QuickMenu-portable
          path: artifacts/QuickMenu-Portable-*.zip
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/QuickMenu-Portable-*.zip
          generate_release_notes: true
