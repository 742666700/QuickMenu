name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job, run for v* tags, may write (to create the GitHub Release).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # NSIS builds the installer (QuickMenu-Setup-<version>-x64.exe) from the small zip's files.
      # Skipped when the runner already has it; Chocolatey is retried, then NSIS's own setup is fetched from SourceForge
      # (curl: SourceForge hands PowerShell's client a web page instead) and run only if it matches the pinned hash.
      - name: Install NSIS
        shell: pwsh
        run: |
          $installed = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path -LiteralPath $_ }
          if ((Get-Command makensis -ErrorAction SilentlyContinue) -or $installed) { Write-Output 'NSIS is already installed.'; exit 0 }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning "choco install nsis failed (attempt $attempt, exit $LASTEXITCODE)."
            Start-Sleep -Seconds (20 * $attempt)
          }
          $setup = Join-Path $env:RUNNER_TEMP 'nsis-3.10-setup.exe'
          curl.exe -sSL --fail --retry 3 --retry-delay 15 -A 'curl' -o $setup 'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.10/nsis-3.10-setup.exe'
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash
          if ($hash -ne '4313D352E0DAFD1F22B6517126A655CAE3B444FA758D2845EDDFBE72F24F7BDD') { throw "nsis-3.10-setup.exe has an unexpected SHA-256 ($hash)." }
          Start-Process -FilePath $setup -ArgumentList '/S' -Wait
          if (-not (Test-Path -LiteralPath "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { throw 'NSIS could not be installed.' }
      # Tests that need a signed-in desktop (windows, tray, hotkeys) are skipped on the build machine; they run in the
      # local build before every release tag.
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -SkipInteractiveTests -Package
      # Two zips: QuickMenu-Portable-<version>-x64.zip carries its own runtime;
      # QuickMenu-Portable-<version>-x64-small.zip needs the .NET 10 Desktop Runtime.
      # QuickMenu-Setup-<version>-x64.exe installs the small build, downloading the runtime first when it is missing;
      # QuickMenu-Setup-<version>-x64-offline.exe carries the runtime installer inside.
      - uses: actions/upload-artifact@v4
        with:
          name: QuickMenu-portable
          path: |
            artifacts/QuickMenu-Portable-*-x64.zip
            artifacts/QuickMenu-Portable-*-x64-small.zip
            artifacts/QuickMenu-Setup-*-x64.exe
            artifacts/QuickMenu-Setup-*-x64-offline.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: QuickMenu-portable
          path: artifacts
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/QuickMenu-Portable-*-x64.zip
            artifacts/QuickMenu-Portable-*-x64-small.zip
            artifacts/QuickMenu-Setup-*-x64.exe
            artifacts/QuickMenu-Setup-*-x64-offline.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
